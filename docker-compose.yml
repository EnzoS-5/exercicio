services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres-cursos
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - rede

  app:
    build: .
    container_name: cursos-api
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres-cursos
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8080:8080"
    networks:
      - rede

volumes:
  postgres-data:

networks:
  rede:
    driver: bridge
